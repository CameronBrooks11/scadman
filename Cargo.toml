[workspace]
resolver = "3"
members = ["crates/scadman-core", "crates/scadman-cli"]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/CameronBrooks11/scadman"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.8"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
scadman-core = { path = "crates/scadman-core" }
