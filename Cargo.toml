[workspace]
resolver = "3"
members = ["crates/scadman-core", "crates/scadman-cli"]

[workspace.package]
version = "0.1.0-alpha.3"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/CameronBrooks11/scadman"
rust-version = "1.88"  # let-chains in scadman-core/src/resolver.rs stabilised here

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
sha2 = "0.11"
regex = "1"
tempfile = "3"
scadman-core = { path = "crates/scadman-core" }
