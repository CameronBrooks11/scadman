[workspace]
resolver = "3"
members = ["crates/scadman-core", "crates/scadman-cli"]

[workspace.package]
version = "0.1.0-alpha"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/CameronBrooks11/scadman"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
sha2 = "0.10"
regex = "1"
tempfile = "3"
unicode-normalization = "0.1"
scadman-core = { path = "crates/scadman-core" }
