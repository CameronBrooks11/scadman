# Build the documentation site with mdBook, and publish it to GitHub Pages from main.
#
# A pull request builds the site and uploads it as an artifact but does not deploy:
# the github-pages environment accepts deployments from main only.

name: Docs

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - book.toml
      # Rendered into the site by docs/changelog.md and docs/contributing.md.
      - CHANGELOG.md
      - CONTRIBUTING.md
      - .github/workflows/docs.yml
  pull_request:
    branches: [main]
    paths:
      - docs/**
      - book.toml
      - CHANGELOG.md
      - CONTRIBUTING.md
      - .github/workflows/docs.yml
  workflow_dispatch:

# Least privilege by default; the deploy job declares what it needs.
permissions:
  contents: read

# One deployment at a time, and never cancel a publish that is under way.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # Pinned by version and checksum. Nothing updates this pin automatically:
      # dependabot watches action refs, not a download URL. The digest is the one
      # GitHub reports for the release asset.
      - name: Install mdBook
        env:
          MDBOOK_VERSION: "0.5.4"
          MDBOOK_SHA256: "3f28de05dafca9d0f2eab99c662116b0e37b89b1d96a08f8f430b9eeae958cd7"
        run: |
          set -euo pipefail
          url="https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          curl -sSfL -o mdbook.tar.gz "$url"
          echo "${MDBOOK_SHA256}  mdbook.tar.gz" | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          tar -xzf mdbook.tar.gz -C "$HOME/.local/bin"
          rm mdbook.tar.gz
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Build
        run: mdbook build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: book

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
