# CI with a unified "ok" gate for branch protection.
# The only required status check is `ok`; add jobs to its `needs:` list rather than
# to branch protection directly.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege by default: these jobs only read the repository.
# A job needing more declares it itself, so the elevation stays visible
# at the job that uses it.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # dorny/paths-filter reads the changed-file list from the REST API on
    # pull_request events, which needs pull-requests: read. On push it uses git
    # against the checkout instead, so contents: read covers that path.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          # A file counts as code only if it matches every pattern below. Under the
          # default, `some`, the first pattern matches everything and the two
          # exclusions change nothing.
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!docs/**'
              - '!**/*.md'

  check:
    name: Check
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v4
      # The release build passes --locked, so a stale Cargo.lock would fail at
      # tag time. Catch it here instead, on the PR that introduces it. metadata
      # resolves the graph without compiling, so the check costs seconds.
      - name: Cargo.lock matches Cargo.toml
        run: cargo metadata --locked --format-version 1 > /dev/null
      - name: Check (fmt-check + typecheck)
        run: just fmt-check && just typecheck

  # Clippy runs with -D warnings but does not gate: a new Rust release ships new
  # lints, and those would otherwise fail CI on code nobody touched. Findings are
  # visible in the job log; `ok` deliberately does not depend on this.
  lint:
    name: Lint (advisory)
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v4
      - name: Clippy
        run: just lint

  # Proves the rust-version in Cargo.toml is true rather than aspirational.
  #
  # The toolchain is read from the manifest rather than pinned here, so the two
  # cannot drift: bumping rust-version moves this job with it, and no numeric
  # action ref is left for dependabot to "update". It proposed exactly that once
  # (dtolnay/rust-toolchain@1.88 -> @1.100), which would have checked the
  # declared minimum against a compiler twelve releases newer than the claim —
  # the job would have stayed green while proving nothing. @master is the
  # action's default branch, and is what takes a `toolchain` input.
  #
  # Declare the MSRV in full (1.88, not 1.9): the action expands an abbreviated
  # two-part version against the current release count, so `1.9` installs 1.90.
  msrv:
    name: MSRV (declared minimum)
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Read the declared MSRV
        id: msrv
        run: |
          version="$(sed -n "s/^[[:space:]]*rust-version[[:space:]]*=[[:space:]]*['\"]\([^'\"]*\)['\"].*/\1/p" Cargo.toml)"
          if [ -z "$version" ]; then
            echo "no rust-version found in Cargo.toml [workspace.package]" >&2
            exit 1
          fi
          # The action interpolates `toolchain` straight into a `run:` line, so
          # assert the shape here: a manifest value is repo-controlled data, and
          # anything exotic in it would reach that line as shell, not a version.
          case "$version" in
            *[!0-9.]* | *..* | .* | *.)
              echo "unexpected rust-version in Cargo.toml: '$version'" >&2
              exit 1
              ;;
          esac
          echo "Declared MSRV: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
      - name: Check on the declared minimum
        run: cargo check --all-targets --all-features

  # Every OS a release ships a binary for. Lockfiles must verify across them, so
  # the hash goldens run on each.
  test:
    name: Test (${{ matrix.os }})
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v4
      - name: Test
        run: just test

  # OpenSCAD 2021.01, the current stable release, cannot read through a junction or a
  # symlink on Windows once a library includes its own files (#132). Render a real
  # library with nested includes through `scadman run`, as a Windows user would: with
  # OpenSCAD where its installer puts it, which is not on PATH (#133).
  render-windows:
    name: Render (windows-latest, OpenSCAD 2021.01)
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --locked -p scadman-cli
      - name: Install OpenSCAD 2021.01 where its installer puts it, off PATH
        run: |
          Invoke-WebRequest https://files.openscad.org/OpenSCAD-2021.01-x86-64.zip -OutFile osc.zip
          Expand-Archive osc.zip -DestinationPath "$env:RUNNER_TEMP\osc"
          Move-Item "$env:RUNNER_TEMP\osc\openscad-2021.01" "$env:ProgramFiles\OpenSCAD"
          if (Get-Command openscad -ErrorAction SilentlyContinue) { throw "openscad is on PATH, so this would not test the fallback" }
      - name: Render tessella through scadman run
        run: |
          $sm = "$env:GITHUB_WORKSPACE\target\debug\scadman.exe"
          New-Item -ItemType Directory "$env:RUNNER_TEMP\proj" | Out-Null
          Set-Location "$env:RUNNER_TEMP\proj"
          & $sm init
          & $sm add tessella https://github.com/CameronBrooks11/tessella --tag v0.1.0
          & $sm lock
          & $sm doctor
          "include <tessella/tess.scad>`ncube(1);" | Set-Content demo.scad
          & $sm run demo.scad -o demo.stl
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path demo.stl)) { throw "scadman run did not render demo.stl" }

  # The setup action (setup/action.yml) on every OS it supports. Used from ./setup it has
  # no release in its path, so the version is given; resolve-version.sh's own tests cover
  # reading it from a downloaded action's path.
  setup-action:
    name: Setup action (${{ matrix.os }})
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Version resolution
        shell: bash
        run: bash setup/test-resolve-version.sh
      - id: setup
        uses: ./setup
        with:
          version: v0.1.0-alpha.6
          sync: "true"
          working-directory: fixtures/setup-project
      - name: scadman is on PATH and the project is synced
        shell: bash
        env:
          OUTPUT: ${{ steps.setup.outputs.openscadpath }}
        run: |
          scadman --version | grep -F 0.1.0-alpha.6
          test "$OPENSCADPATH" = "$OUTPUT"
          test -f "$OPENSCADPATH/tessella/tess.scad"

  ok:
    name: ok
    if: always()
    needs: [changes, check, test, msrv, render-windows, setup-action]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if any upstream job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - name: Pass
        run: echo 'All checks passed or were skipped'
