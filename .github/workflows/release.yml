# Build a Linux binary and publish a GitHub release when a `v*` tag is pushed.

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release -p scadman-cli

      - name: Package
        run: tar -C target/release -czf "scadman-${{ github.ref_name }}-x86_64-unknown-linux-gnu.tar.gz" scadman

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --notes-file CHANGELOG.md \
            --prerelease \
            scadman-*.tar.gz
