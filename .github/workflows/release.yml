# Build a Linux binary and publish a GitHub release when a `v*` tag is pushed.

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release -p scadman-cli

      # The archive plus its SHA-256 in `sha256sum -c` format, so a downloaded
      # binary can be verified before it goes on PATH.
      - name: Package
        run: |
          tar -C target/release -czf "scadman-${{ github.ref_name }}-x86_64-unknown-linux-gnu.tar.gz" scadman
          sha256sum scadman-*.tar.gz > checksums.txt

      # Publish only this version's CHANGELOG section, not the whole file.
      - name: Extract release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v pre="## [$version]" '
            substr($0, 1, length(pre)) == pre { found = 1; next }
            /^## / { if (found) exit }
            found && !/^\[[^]]*\]: / { print }
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "No CHANGELOG.md section found for $version" >&2
            exit 1
          fi

      # Deliberately not --prerelease: GitHub excludes prereleases from
      # /repos/:owner/:repo/releases/latest, so the flag 404s that endpoint and
      # `gh release view` with no tag, which is what scripted installs reach for.
      # The pre-1.0 version string carries the maturity signal instead.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --notes-file release-notes.md \
            scadman-*.tar.gz checksums.txt
