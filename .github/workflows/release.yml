# Build the binaries and publish a GitHub release when a `v*` tag is pushed.
#
# A pull request that changes this file runs the same build and packaging without
# publishing, so the matrix and the checksums are proven before a tag depends on them.

name: Release

on:
  push:
    tags: ["v*"]
  pull_request:
    paths: [".github/workflows/release.yml"]

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-latest, native: true }
          # macos-latest is arm64; it cross-builds the Intel binary, which it cannot run.
          - { target: aarch64-apple-darwin, os: macos-latest, native: true }
          - { target: x86_64-apple-darwin, os: macos-latest, native: false }
          - { target: x86_64-pc-windows-msvc, os: windows-latest, native: true }
    defaults:
      run:
        shell: bash
    env:
      # The tag on a release; on a pull request, a placeholder (ref_name has a slash).
      VERSION: ${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # --locked: build exactly the dependency set recorded in Cargo.lock. Without
      # it, a lock that disagrees with Cargo.toml is silently rewritten inside the
      # job, and the binary ships from a resolution the repository never recorded.
      - name: Build
        run: cargo build --release --locked -p scadman-cli --target ${{ matrix.target }}

      - name: Run the binary
        if: matrix.native
        run: target/${{ matrix.target }}/release/scadman --version

      - name: Package
        if: runner.os != 'Windows'
        run: tar -C "target/${{ matrix.target }}/release" -czf "scadman-$VERSION-${{ matrix.target }}.tar.gz" scadman

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "target/${{ matrix.target }}/release/scadman.exe" -DestinationPath "scadman-$env:VERSION-${{ matrix.target }}.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: scadman-${{ matrix.target }}
          path: |
            scadman-*.tar.gz
            scadman-*.zip
          if-no-files-found: error

  # One job writes one checksums.txt over every archive.
  checksums:
    name: Checksums
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: scadman-*
          merge-multiple: true
          path: dist

      # The archives plus their SHA-256 in `sha256sum -c` format, so a downloaded
      # binary can be verified before it goes on PATH.
      - name: Checksums
        working-directory: dist
        run: |
          sha256sum scadman-*.tar.gz scadman-*.zip > checksums.txt
          cat checksums.txt

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          if-no-files-found: error

  # The install commands from README.md and docs/getting-started.md, run as written
  # on each OS, against what is about to be published. Then the installed binary locks
  # a real library from GitHub, which has to hash the same on every OS.
  install:
    name: Install (${{ matrix.os }})
    needs: [checksums]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Install as documented (Linux)
        if: runner.os == 'Linux'
        working-directory: dist
        run: |
          sha256sum --ignore-missing -c checksums.txt
          tar -xzf scadman-*-x86_64-unknown-linux-gnu.tar.gz
          install -Dm755 scadman ~/.local/bin/scadman

      - name: Install as documented (macOS)
        if: runner.os == 'macOS'
        working-directory: dist
        run: |
          shasum -a 256 --ignore-missing -c checksums.txt
          tar -xzf scadman-*-aarch64-apple-darwin.tar.gz
          xattr -d com.apple.quarantine scadman 2>/dev/null || true
          mkdir -p ~/.local/bin && install -m755 scadman ~/.local/bin/scadman

      - name: Install as documented (Windows)
        if: runner.os == 'Windows'
        working-directory: dist
        shell: pwsh
        run: |
          $zip = Get-Item scadman-*-x86_64-pc-windows-msvc.zip
          $want = ((Select-String -Path checksums.txt -Pattern $zip.Name -SimpleMatch).Line -split '\s+')[0]
          $have = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          if ($have -ne $want) { throw "checksum mismatch for $($zip.Name)" }
          Unblock-File $zip
          $dir = "$env:LOCALAPPDATA\Programs\scadman"
          Expand-Archive $zip -DestinationPath $dir -Force
          [Environment]::SetEnvironmentVariable("Path", [Environment]::GetEnvironmentVariable("Path", "User") + ";$dir", "User")
          "$dir" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - name: Put it on PATH (Linux, macOS)
        if: runner.os != 'Windows'
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # tessella v0.1.0's content hash, as locked on Linux. The same value on every OS
      # is what lets a lockfile written on one verify on the others.
      - name: Lock a real library
        shell: bash
        run: |
          scadman --version
          mkdir smoke && cd smoke
          scadman init
          scadman add tessella https://github.com/CameronBrooks11/tessella --tag v0.1.0
          scadman lock
          scadman sync
          cat scadman.lock
          grep -q 'hash = "116f662e81b428761c6a5ca1e3c1f0884ffa47d9e595bed4fb379744d5f2b9ad"' scadman.lock
          test -f .scadman/env/tessella/tess.scad

  release:
    name: Release
    needs: [install]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      # Publish only this version's CHANGELOG section, not the whole file.
      - name: Extract release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v pre="## [$version]" '
            substr($0, 1, length(pre)) == pre { found = 1; next }
            /^## / { if (found) exit }
            found && !/^\[[^]]*\]: / { print }
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "No CHANGELOG.md section found for $version" >&2
            exit 1
          fi

      # Deliberately not --prerelease: GitHub excludes prereleases from
      # /repos/:owner/:repo/releases/latest, so the flag 404s that endpoint and
      # `gh release view` with no tag, which is what scripted installs reach for.
      # The pre-1.0 version string carries the maturity signal instead.
      #
      # No --latest either: gh only sends make_latest when the flag is given, and
      # the API defaults it to true, so each new tag becomes Latest. That is right
      # while releases are linear — a patch tagged behind a newer line would need
      # --latest=false. (gh's help says "automatic based on date and version";
      # that is the API's `legacy` value, which gh does not send.)
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --notes-file release-notes.md \
            dist/scadman-*.tar.gz dist/scadman-*.zip dist/checksums.txt
